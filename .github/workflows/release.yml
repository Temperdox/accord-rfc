name: Release (client installers)

# Builds the Accord desktop CLIENT installers (the client can also host a
# server) for Windows, macOS, and Linux when a version tag is pushed, and
# attaches them to a GitHub Release.
#
# NOTE: this intentionally does NOT build or publish the standalone
# `accord-server` deployment - only the client is released.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: write # tauri-action creates the Release and uploads installers
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ships mesh-capable (the vendored wintun.dll is bundled next
          # to the exe). macOS/Linux mesh builds are unverified, so they stay on
          # default features until tested.
          - os: windows-latest
            args: "--features mesh"
          - os: macos-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      # opus is compiled from the C source vendored in audiopus_sys, whose
      # CMakeLists declares `cmake_minimum_required(VERSION 3.1)`. CMake 4 -
      # which the runners now ship - refuses anything below 3.5 outright, so
      # every platform's build died here. This is the escape hatch CMake's own
      # error message points at, and it is only consulted by that vendored
      # build. Linux additionally gets libopus-dev below, so it takes the
      # pkg-config path and never reaches CMake at all.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies (Tauri v2 + native audio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libopus-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/accord-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/accord-client
        run: npm ci --ignore-scripts

      # tauri-action runs the configured beforeBuildCommand (npm run build),
      # bundles per-OS installers, and uploads them to the Release for the tag.
      - name: Build client + publish installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/accord-client
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Accord ${{ github.ref_name }}"
          # Published straight away rather than as a draft: these alphas exist
          # to be handed to testers, and a draft is invisible to everyone
          # without write access - so every release needed a manual click
          # before anyone could download it. `prerelease` keeps them clearly
          # marked and out of the "Latest release" slot.
          #
          # The draft step used to be the gate that caught a release where one
          # platform silently failed to build; the CI workflow now compiles the
          # client on Linux and Windows for every push, which catches that
          # earlier and without the manual step. Set releaseDraft back to true
          # to restore the old behaviour.
          releaseDraft: false
          prerelease: true
