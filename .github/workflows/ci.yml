name: CI

# Checks on every push/PR.
#
# The `client` job exists because the desktop client is where platform-specific
# breakage hides: its media stack (cpal/WASAPI, WebKitGTK) and its webview glue
# are compiled per OS, so a change that is clean on Linux can fail to build on
# Windows and vice versa. Until this job existed the client was only ever built
# by the release workflow - on a version tag, long after the offending commit.

on:
  push:
    branches: [main, master]
  pull_request:

# Nothing here writes to the repo; checkout only needs to read it.
permissions:
  contents: read

jobs:
  workspace:
    name: workspace (server + libs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format check
        run: cargo fmt --all --check
      - name: Test (workspace, excluding the desktop client)
        run: cargo test --workspace --exclude accord-client

  client:
    name: client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing should still report the other, since the whole point is
      # telling platform-specific breakage apart from a general one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Only matters if this job ever *runs* a Windows binary: build.rs embeds a
      # requireAdministrator manifest into every Windows executable, test
      # binaries included, and those then refuse to start from the runner's
      # non-elevated shell. Windows currently only compiles (see below), but
      # leaving the documented opt-out set means switching it back to `cargo
      # test` doesn't fail mysteriously. Release builds never set this.
      ACCORD_NO_ELEVATION_MANIFEST: "1"
      # opus is compiled from the C source vendored in audiopus_sys, whose
      # CMakeLists declares `cmake_minimum_required(VERSION 3.1)`; CMake 4 (on
      # the runners now) refuses anything below 3.5. This is the escape hatch
      # CMake's own error names, and only that vendored build consults it.
      # Linux gets libopus-dev below and so never reaches CMake.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # libasound2-dev is what cpal needs to build (alsa-sys); without it the
      # Linux client build fails long before anything interesting is compiled.
      - name: Install Linux build dependencies (Tauri v2 + native audio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libopus-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
          # Separate caches per OS; the artefacts are not interchangeable.
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/accord-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/accord-client
        run: npm ci --ignore-scripts

      # `npm run`, not `npx`: npx will fetch and execute a package from the
      # registry when it isn't installed locally, which is a supply-chain hole
      # in CI even when the local install normally wins the race.
      - name: Type-check the frontend
        working-directory: crates/accord-client
        run: npm run typecheck

      # tauri-build resolves frontendDist (../dist) while compiling the crate,
      # so the frontend has to be built before the Rust build, not after.
      - name: Build the frontend
        working-directory: crates/accord-client
        run: npm run build

      - name: Test the client
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p accord-client

      # Windows compiles but does not run: linking this crate there is slow, and
      # the platform breakage this job exists to catch is type-level (the
      # windows-core conflict that started it was 18 trait-bound errors), which
      # `check` surfaces just as well. `--all-targets` matters - it type-checks
      # test code too, where two of today's failures actually lived.
      #
      # `--features mesh` mirrors what the release workflow ships for Windows,
      # which was otherwise only ever compiled at tag time. It is not a superset
      # of the default build - mesh.rs has `cfg(not(feature = "mesh"))` stubs -
      # but Ubuntu above tests with default features, so between the two jobs
      # every cfg path gets compiled.
      #
      # Needs CMake and a C compiler for opus's vendored source; both ship on
      # the windows-latest runner image.
      - name: Type-check the client (as released, with mesh)
        if: matrix.os == 'windows-latest'
        run: cargo check -p accord-client --all-targets --features mesh
